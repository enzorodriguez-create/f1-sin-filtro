<link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
>
<link rel="stylesheet"
      href="{{ url_for('static', filename='styles/login.css') }}">

<div class="login-page">

    <div class="bg-grid"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>

    <main class="login-main">

        <div class="login-card">

            <div class="card-bar"></div>

            <div class="card-top">

                <span class="gateway">
                    <span class="gateway-line"></span>
                    F1 SIN FILTRO
                </span>

                <span class="pass">
                    PADDOCK PASS // 2026
                </span>

            </div>

            <div class="card-title">

                <h1>ACCESO AL PADDOCK</h1>

                <p>
                    Identifícate para ingresar al Paddock de F1 Sin Filtro.
                </p>

            </div>


            <form action="#" method="POST" class="login-form">

                <div class="field">

                    <label for="email">
                        CORREO ELECTRÓNICO
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon material-symbols-outlined">
                            mail
                        </span>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="piloto@f1sinfiltro.com"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <div class="label-row">

                        <label for="password">
                            CONTRASEÑA
                        </label>

                        <a class="forgot" href="#">
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>

                    <div class="input-wrap">

                        <span class="input-icon material-symbols-outlined">
                            lock
                        </span>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            required
                        >

                    </div>

                </div>


                <div class="options">

                    <label class="remember">

                        <input
                            id="remember"
                            name="remember"
                            type="checkbox"
                        >

                        <span>
                            Recordarme
                        </span>

                    </label>

                    

                </div>


                <button type="submit" class="login-btn">

                    <span>
                        INICIAR SESIÓN
                    </span>

                    <span class="material-symbols-outlined">
                        arrow_forward
                    </span>

                </button>

            </form>

            <div class="login-divider">

                <span></span>

                <p> O CONTINUA CON </p>

                <span></span>
            </div>

            <a href="{{ url_for('login_google') }}" class="google-btn">

                <span class="google-icon">
                    G
                </span>

                <span>
                    CONTINUAR CON GOOGLE
                </span>

            </a>


            <div class="card-bottom">

                <p>
                    ¿No tenés cuenta?

                    <a href="{{ url_for('registro') }}">
                        Registrate acá
                    </a>
                </p>

            </div>

        </div>

    </main>

</div>
