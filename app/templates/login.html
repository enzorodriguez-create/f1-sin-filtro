<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Iniciar sesión - F1 Sin Filtro
  </title>


  <!-- ICONOS -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles/login.css') }}"
  >

</head>


<body>


  <div class="login-page">

    <div class="bg-grid"></div>

    <div class="glow glow-top"></div>

    <div class="glow glow-bottom"></div>


    <main class="login-main">


      <div class="login-card">


        <div class="card-bar"></div>


        <div class="card-top">

          <span class="gateway">

            <span class="gateway-line"></span>

            F1 SIN FILTRO

          </span>


          <span class="pass">
            PADDOCK PASS // 2026
          </span>

        </div>


        <div class="card-title">

          <h1>
            ACCESO AL PADDOCK
          </h1>

          <p>
            Identificate para ingresar al Paddock de F1 Sin Filtro.
          </p>

        </div>



        <!-- LOGIN NORMAL -->

        <form
          action="{{ url_for('auth.login') }}"
          method="POST"
          class="login-form"
        >


          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              CORREO ELECTRÓNICO
            </label>


            <div class="input-wrap">

              <span class="input-icon material-symbols-outlined">
                mail
              </span>


              <input
                id="email"
                name="email"
                type="email"
                placeholder="piloto@f1sinfiltro.com"
                required
              >

            </div>

          </div>



          <!-- CONTRASEÑA -->

          <div class="field">

            <div class="label-row">

              <label for="password">
                CONTRASEÑA
              </label>

            </div>


            <div class="input-wrap">

              <span class="input-icon material-symbols-outlined">
                lock
              </span>


              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                required
              >

            </div>

          </div>



          <!-- ERROR -->

          {% if error %}

          <div class="login-error">

            <span class="material-symbols-outlined">
              error
            </span>

            <span>
              {{ error }}
            </span>

          </div>

          {% endif %}



          <!-- BOTÓN -->

          <button
            type="submit"
            class="login-btn"
          >

            <span>
              INICIAR SESIÓN
            </span>

            <span class="material-symbols-outlined">
              arrow_forward
            </span>

          </button>


        </form>



        <!-- GOOGLE -->

        <div class="login-divider">

          <span></span>

          <p>
            O CONTINUÁ CON
          </p>

          <span></span>

        </div>


        <a
          href="{{ url_for('auth.login_google') }}"
          class="google-btn"
        >

          <span class="google-icon">
            G
          </span>

          <span>
            CONTINUAR CON GOOGLE
          </span>

        </a>



        <!-- REGISTRO -->

        <div class="card-bottom">

          <p>

            ¿No tenés cuenta?

            <a href="{{ url_for('auth.registro') }}">
              Registrate acá
            </a>

          </p>

        </div>


      </div>


    </main>


  </div>


</body>

</html>
