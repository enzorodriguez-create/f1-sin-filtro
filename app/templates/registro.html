<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <title>
    Registro - F1 Sin Filtro
  </title>


  <!-- FUENTES -->

  <link
    href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@700&display=swap"
    rel="stylesheet"
  >


  <!-- ICONOS -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles/registro.css') }}"
  >

</head>


<body class="register">


  <!-- FONDO -->

  <div class="bg-grid"></div>

  <div class="glow glow-top"></div>

  <div class="glow glow-bottom"></div>



  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">


      <a
        class="logo"
        href="{{ url_for('main.inicio') }}"
      >

        <span class="logo-white">
          F1
        </span>

        <span class="logo-red">
          SIN FILTRO
        </span>

      </a>


    </div>

  </header>



  <!-- CONTENIDO PRINCIPAL -->

  <main class="main">


    <div class="card card-wide">


      <div class="card-bar"></div>


      <div class="card-top">

        <span class="gateway">

          <span class="gateway-line"></span>

          REGISTRO OFICIAL

        </span>


        <span class="pass">
          PADDOCK PASS // 2026
        </span>

      </div>



      <div class="card-title">

        <h1>
          CREAR CUENTA
        </h1>

        <p>
          Unite a la comunidad de F1 Sin Filtro.
        </p>

      </div>



      <form
        action="{{ url_for('auth.registro') }}"
        method="POST"
        class="form"
      >


        <!-- NOMBRE Y APELLIDO -->

        <div class="row-2">


          <div class="field">

            <label for="nombre">
              NOMBRE
            </label>


            <div class="input-wrap">

              <input
                class="no-icon"
                id="nombre"
                name="nombre"
                type="text"
                placeholder="Ayrton"
                required
              >

            </div>

          </div>



          <div class="field">

            <label for="apellido">
              APELLIDO
            </label>


            <div class="input-wrap">

              <input
                class="no-icon"
                id="apellido"
                name="apellido"
                type="text"
                placeholder="Senna"
                required
              >

            </div>

          </div>


        </div>



        <!-- USUARIO -->

        <div class="field">

          <label for="usuario">
            USUARIO
          </label>


          <div class="input-wrap">

            <span class="input-icon material-symbols-outlined">
              alternate_email
            </span>


            <input
              id="usuario"
              name="usuario"
              type="text"
              placeholder="magic_senna"
              required
            >

          </div>

        </div>



        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            CORREO ELECTRÓNICO
          </label>


          <div class="input-wrap">

            <span class="input-icon material-symbols-outlined">
              mail
            </span>


            <input
              id="email"
              name="email"
              type="email"
              placeholder="piloto@f1sinfiltro.com"
              required
            >

          </div>

        </div>



        <!-- CONTRASEÑAS -->

        <div class="row-2">


          <div class="field">

            <label for="password">
              CONTRASEÑA
            </label>


            <div class="input-wrap">

              <span class="input-icon material-symbols-outlined">
                lock
              </span>


              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                required
              >

            </div>

          </div>



          <div class="field">

            <label for="confirm_password">
              CONFIRMAR CONTRASEÑA
            </label>


            <div class="input-wrap">

              <span class="input-icon material-symbols-outlined">
                verified_user
              </span>


              <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                placeholder="••••••••"
                required
              >

            </div>

          </div>


        </div>



        <!-- ERROR -->

        {% if error %}

        <div class="register-error">

          <span class="material-symbols-outlined">
            error
          </span>

          <span>
            {{ error }}
          </span>

        </div>

        {% endif %}



        <!-- BOTÓN -->

        <button
          type="submit"
          class="btn"
        >

          <span>
            CREAR CUENTA
          </span>

          <span class="material-symbols-outlined">
            arrow_forward
          </span>

        </button>


      </form>



      <!-- IR A LOGIN -->

      <div class="card-bottom">

        <p>

          ¿Ya tenés cuenta?

          <a href="{{ url_for('auth.login') }}">
            Iniciar sesión
          </a>

        </p>

      </div>


    </div>


  </main>



  <!-- FOOTER -->

  <footer class="footer">

    <div class="footer-inner">

      <span>
        © 2026 F1 SIN FILTRO
      </span>

    </div>

  </footer>


</body>

</html>
