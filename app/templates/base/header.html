<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>F1 Sin Filtro</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;700;800;900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Sora:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet"
    >


    <!-- CSS general -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles/style.css') }}"
    >

</head>


<body class="site-body">


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar navbar-expand-lg site-navbar">

    <div class="container-fluid site-navbar-container">


        <!-- Logo -->
        <a
            class="site-logo"
            href="{{ url_for('main.inicio') }}"
        >

            <span class="site-logo-f1">
                F1
            </span>

            <span class="site-logo-name">
                SIN FILTRO
            </span>

        </a>


        <!-- Botón mobile -->
        <button
            class="navbar-toggler site-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
        >

            <span class="material-symbols-outlined">
                menu
            </span>

        </button>


        <!-- Navegación -->
        <div
            class="collapse navbar-collapse"
            id="menuPrincipal"
        >


            <ul class="navbar-nav site-nav-links">


                <!-- INICIO -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('main.inicio') }}"
                    >
                        INICIO
                    </a>

                </li>


                <!-- NOTICIAS -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('main.noticias') }}"
                    >
                        NOTICIAS
                    </a>

                </li>


                <!-- CATEGORÍAS -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('main.categorias') }}"
                    >
                        CATEGORÍAS
                    </a>

                </li>


                <!-- CALENDARIO -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('main.calendario') }}"
                    >
                        CALENDARIO
                    </a>

                </li>


                <!-- PREMIUM -->
                <li class="nav-item">

                    <a
                        class="nav-link site-premium-link"
                        href="{{ url_for('main.premium') }}"
                    >

                        <span class="material-symbols-outlined">
                            workspace_premium
                        </span>

                        PREMIUM

                    </a>

                </li>


                <!-- PERFIL -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('perfil.perfil') }}"
                    >
                        PERFIL
                    </a>

                </li>


            </ul>


            <!-- Parte derecha -->
            <div class="site-nav-actions">


                {% if session.get("usuario") %}

                    <!-- Cerrar sesión -->
                    <a
                        class="site-register"
                        href="{{ url_for('auth.logout') }}"
                    >
                        CERRAR SESIÓN
                    </a>

                {% else %}

                    <!-- Login -->
                    <a
                        class="site-login"
                        href="{{ url_for('auth.login') }}"
                    >
                        INICIAR SESIÓN
                    </a>


                    <!-- Registro -->
                    <a
                        class="site-register"
                        href="{{ url_for('auth.registro') }}"
                    >
                        REGISTRARSE
                    </a>

                {% endif %}


            </div>


        </div>

    </div>

</nav>


<main class="site-main">
